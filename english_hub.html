<title>英文學習中心</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  --ground: #f1f5f9;
  --surface: #ffffff;
  --surface-hover: #f8fafc;
  --text: #1e293b;
  --text-2: #64748b;
  --text-3: #94a3b8;
  --border: #e2e8f0;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --active: #059669;
  --active-soft: #d1fae5;
  --p1: #dc2626;
  --p1-soft: #fee2e2;
  --p2: #2563eb;
  --p2-soft: #dbeafe;
  --p3: #d97706;
  --p3-soft: #fef3c7;
  --tier1: #059669;
  --tier2: #2563eb;
  --tier3: #94a3b8;
  --shadow: 0 1px 3px rgba(15,23,42,.06);
  --shadow-lg: 0 4px 12px rgba(15,23,42,.08);
  --radius: 10px;
  --radius-sm: 6px;
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-body: 'Source Sans 3', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f172a;
    --surface: #1e293b;
    --surface-hover: #263348;
    --text: #e2e8f0;
    --text-2: #94a3b8;
    --text-3: #64748b;
    --border: #334155;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --active: #34d399;
    --active-soft: #064e3b;
    --p1: #f87171;
    --p1-soft: #450a0a;
    --p2: #60a5fa;
    --p2-soft: #172554;
    --p3: #fbbf24;
    --p3-soft: #451a03;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --ground: #0f172a;
  --surface: #1e293b;
  --surface-hover: #263348;
  --text: #e2e8f0;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --border: #334155;
  --accent: #60a5fa;
  --accent-soft: #1e3a5f;
  --active: #34d399;
  --active-soft: #064e3b;
  --p1: #f87171;
  --p1-soft: #450a0a;
  --p2: #60a5fa;
  --p2-soft: #172554;
  --p3: #fbbf24;
  --p3-soft: #451a03;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.4);
}

body {
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 0 40px;
  max-width: 880px;
  margin: 0 auto;
}
h1,h2,h3,h4 { font-family: var(--font-display); line-height: 1.25; margin: 0; text-wrap: balance; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: var(--font-body); cursor: pointer; border: none; background: none; color: var(--text); }
input { font-family: var(--font-body); }

/* ── Header ── */
.site-header { padding: 24px 0 0; }
.site-header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
.site-header .subtitle { color: var(--text-2); font-size: .875rem; margin-top: 2px; }

/* ── Main Nav ── */
.main-nav {
  display: flex; gap: 0; margin-top: 20px;
  border-bottom: 2px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.main-nav button {
  padding: 10px 16px; font-size: .9rem; font-weight: 500;
  white-space: nowrap; position: relative; color: var(--text-2);
  transition: color .15s;
}
.main-nav button:hover { color: var(--text); }
.main-nav button.active {
  color: var(--accent); font-weight: 600;
}
.main-nav button.active::after {
  content: ''; position: absolute; bottom: -2px; left: 8px; right: 8px;
  height: 2px; background: var(--accent); border-radius: 1px;
}

/* ── Views ── */
.view { padding-top: 20px; }

/* ── Time Strip ── */
.time-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}
.time-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  text-align: center;
}
.time-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.time-card.active { border-color: var(--accent); background: var(--accent-soft); }
.time-card.now { border-color: var(--active); }
.time-card.now .time-badge { background: var(--active); color: #fff; }
.time-badge {
  display: inline-block; font-size: .7rem; font-weight: 600; font-variant-numeric: tabular-nums;
  background: var(--border); color: var(--text-2);
  padding: 2px 6px; border-radius: 3px; letter-spacing: .03em;
}
.time-icon { font-size: 1.3rem; margin: 6px 0 2px; }
.time-label { font-family: var(--font-display); font-weight: 600; font-size: .85rem; }
.time-dur { font-size: .75rem; color: var(--text-2); }

/* ── Slot Content ── */
.slot-intro {
  margin-top: 16px; padding: 16px; background: var(--surface);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.slot-intro h3 { font-size: 1rem; }
.slot-intro .method-tag {
  display: inline-block; font-size: .75rem; font-weight: 600;
  background: var(--accent-soft); color: var(--accent);
  padding: 2px 8px; border-radius: 4px; margin-top: 6px;
}
.slot-intro p { font-size: .875rem; color: var(--text-2); margin: 8px 0 0; }

/* ── Section Heading ── */
.section-heading {
  font-size: .8rem; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-3); margin: 24px 0 10px;
}

/* ── Show Cards ── */
.show-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}
.show-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 6px;
  border-left: 3px solid var(--border);
  transition: box-shadow .15s;
}
.show-card:hover { box-shadow: var(--shadow-lg); }
.show-card[data-lang="en"] { border-left-color: var(--accent); }
.show-card[data-lang="zh"] { border-left-color: var(--p3); }
.show-card .show-top { display: flex; align-items: center; gap: 8px; }
.show-card .show-title { font-family: var(--font-display); font-weight: 600; font-size: .9rem; flex: 1; }
.show-card .show-desc { font-size: .8rem; color: var(--text-2); line-height: 1.45; }
.show-card .show-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: auto; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; font-size: .7rem; font-weight: 600;
  padding: 1px 6px; border-radius: 3px; white-space: nowrap;
}
.badge-t1 { background: #d1fae5; color: #065f46; }
.badge-t2 { background: #dbeafe; color: #1e40af; }
.badge-t3 { background: #f1f5f9; color: #64748b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .badge-t1 { background: #064e3b; color: #6ee7b7; }
  :root:not([data-theme="light"]) .badge-t2 { background: #172554; color: #93c5fd; }
  :root:not([data-theme="light"]) .badge-t3 { background: #334155; color: #94a3b8; }
}
:root[data-theme="dark"] .badge-t1 { background: #064e3b; color: #6ee7b7; }
:root[data-theme="dark"] .badge-t2 { background: #172554; color: #93c5fd; }
:root[data-theme="dark"] .badge-t3 { background: #334155; color: #94a3b8; }

.badge-cat {
  background: var(--surface-hover); color: var(--text-2);
  font-weight: 500;
}
.badge-freq { background: #fef3c7; color: #92400e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .badge-freq { background: #451a03; color: #fbbf24; }
}
:root[data-theme="dark"] .badge-freq { background: #451a03; color: #fbbf24; }

.platform-links { display: flex; gap: 4px; margin-left: auto; }
.platform-links a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 4px;
  font-size: .65rem; font-weight: 700;
  background: var(--surface-hover); color: var(--text-2);
  transition: background .15s;
}
.platform-links a:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; }

/* ── Filter Bar ── */
.filter-bar {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  margin-bottom: 12px;
}
.filter-bar .chip {
  font-size: .78rem; padding: 4px 10px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border);
  font-weight: 500; transition: all .15s; cursor: pointer;
}
.filter-bar .chip:hover { border-color: var(--accent); }
.filter-bar .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Search ── */
.search-box {
  width: 100%; padding: 10px 14px; font-size: .9rem;
  background: var(--surface); border: 2px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  transition: border-color .15s; box-sizing: border-box;
}
.search-box:focus { outline: none; border-color: var(--accent); }
.search-box::placeholder { color: var(--text-3); }

/* ── Course Cards ── */
.course-list { display: flex; flex-direction: column; gap: 6px; }
.course-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow);
  cursor: pointer; transition: box-shadow .15s;
  border-left: 3px solid var(--border);
}
.course-card:hover { box-shadow: var(--shadow-lg); }
.course-card[data-part="1"] { border-left-color: var(--p1); }
.course-card[data-part="2"] { border-left-color: var(--p2); }
.course-card[data-part="3"] { border-left-color: var(--p3); }
.course-card .cc-head { display: flex; align-items: baseline; gap: 8px; }
.course-card .cc-num {
  font-family: var(--font-display); font-weight: 700; font-size: .75rem;
  font-variant-numeric: tabular-nums;
  min-width: 28px;
}
.course-card[data-part="1"] .cc-num { color: var(--p1); }
.course-card[data-part="2"] .cc-num { color: var(--p2); }
.course-card[data-part="3"] .cc-num { color: var(--p3); }
.course-card .cc-title { font-family: var(--font-display); font-weight: 600; font-size: .88rem; }
.course-card .cc-concept { font-size: .8rem; color: var(--text-2); margin-top: 6px; line-height: 1.5; }
.course-card .cc-expand { overflow: hidden; max-height: 0; transition: max-height .3s ease; }
.course-card.open .cc-expand { max-height: 400px; }
.course-card .cc-vocab {
  margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px;
}
.course-card .cc-vocab span {
  font-size: .73rem; padding: 2px 7px; border-radius: 4px;
  background: var(--surface-hover); color: var(--text-2);
  border: 1px solid var(--border);
}
.course-card .cc-level {
  font-size: .7rem; font-weight: 600; padding: 1px 6px;
  border-radius: 3px; background: var(--accent-soft); color: var(--accent);
  margin-left: auto; white-space: nowrap;
}
.part-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.part-tabs .chip { font-size: .78rem; padding: 4px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); font-weight: 500; cursor: pointer; transition: all .15s; }
.part-tabs .chip:hover { border-color: var(--accent); }
.part-tabs .chip.active { color: #fff; }
.part-tabs .chip[data-p="0"].active { background: var(--accent); border-color: var(--accent); }
.part-tabs .chip[data-p="1"].active { background: var(--p1); border-color: var(--p1); }
.part-tabs .chip[data-p="2"].active { background: var(--p2); border-color: var(--p2); }
.part-tabs .chip[data-p="3"].active { background: var(--p3); border-color: var(--p3); }

/* ── Method Cards ── */
.method-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}
.method-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.method-card h4 { font-size: .95rem; }
.method-card .method-en { font-size: .8rem; color: var(--text-2); font-style: italic; }
.method-card p { font-size: .82rem; color: var(--text-2); margin: 8px 0 0; }
.method-card .slot-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.method-card .slot-tag {
  font-size: .68rem; padding: 1px 6px; border-radius: 3px;
  background: var(--active-soft); color: var(--active); font-weight: 500;
}

/* ── Tool Cards ── */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.tool-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 4px;
}
.tool-card h4 { font-size: .95rem; }
.tool-card p { font-size: .82rem; color: var(--text-2); margin: 0; }
.tool-card .tool-link { font-size: .8rem; margin-top: auto; padding-top: 6px; }

/* ── Empty State ── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-3); font-size: .9rem; }

/* ── Responsive ── */
@media (max-width: 640px) {
  body { padding-inline: 12px; }

  /* Header */
  .site-header { padding: 20px 0 0; }
  .site-header h1 { font-size: 1.35rem; }
  .site-header .subtitle { font-size: .95rem; }

  /* Nav — larger tap targets */
  .main-nav { margin-top: 16px; gap: 0; }
  .main-nav button {
    padding: 14px 14px; font-size: 1rem;
  }

  /* Time strip — 2 cols for readability */
  .time-strip {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .time-card { padding: 14px 10px; }
  .time-badge { font-size: .82rem; padding: 3px 8px; }
  .time-icon { font-size: 1.6rem; margin: 8px 0 4px; }
  .time-label { font-size: 1rem; }
  .time-dur { font-size: .88rem; }

  /* Slot content */
  .slot-intro { padding: 14px; }
  .slot-intro h3 { font-size: 1.05rem; }
  .slot-intro .method-tag { font-size: .85rem; padding: 3px 10px; }
  .slot-intro p { font-size: .95rem; }

  /* Section headings */
  .section-heading { font-size: .88rem; margin: 20px 0 10px; }

  /* Show cards — single col, bigger text */
  .show-grid { grid-template-columns: 1fr; gap: 10px; }
  .show-card { padding: 16px; gap: 8px; }
  .show-card .show-title { font-size: 1.05rem; }
  .show-card .show-desc { font-size: .92rem; line-height: 1.5; }

  /* Badges */
  .badge { font-size: .82rem; padding: 3px 8px; }

  /* Platform links — min 40px tap targets */
  .platform-links { gap: 6px; }
  .platform-links a {
    width: 36px; height: 36px; border-radius: 6px;
    font-size: .78rem;
  }

  /* Filter bar & chips */
  .filter-bar { gap: 8px; margin-bottom: 14px; }
  .filter-bar .chip {
    font-size: .92rem; padding: 8px 14px;
  }

  /* Search */
  .search-box { padding: 12px 14px; font-size: 1rem; }

  /* Part tabs */
  .part-tabs { gap: 8px; }
  .part-tabs .chip { font-size: .92rem; padding: 8px 14px; }

  /* Course cards */
  .course-card { padding: 16px; }
  .course-card .cc-num { font-size: .85rem; min-width: 30px; }
  .course-card .cc-title { font-size: 1.02rem; }
  .course-card .cc-concept { font-size: .92rem; margin-top: 8px; }
  .course-card .cc-level { font-size: .8rem; padding: 2px 8px; }
  .course-card .cc-vocab span { font-size: .82rem; padding: 3px 8px; }

  /* Method cards — single col */
  .method-grid { grid-template-columns: 1fr; gap: 12px; }
  .method-card { padding: 18px; }
  .method-card h4 { font-size: 1.08rem; }
  .method-card .method-en { font-size: .92rem; }
  .method-card p { font-size: .92rem; }
  .method-card ol { font-size: .9rem !important; }
  .method-card .slot-tag { font-size: .82rem; padding: 3px 8px; }

  /* Tool cards — single col */
  .tool-grid { grid-template-columns: 1fr; gap: 12px; }
  .tool-card { padding: 18px; }
  .tool-card h4 { font-size: 1.08rem; }
  .tool-card p { font-size: .92rem; }
  .tool-card .tool-link { font-size: .92rem; }

  /* Empty state */
  .empty-state { font-size: 1rem; padding: 32px 16px; }

  /* Inline note text in show cards */
  .show-card .show-meta span[style] { font-size: .82rem !important; }
}

/* ── Highlights ── */
mark { background: var(--accent-soft); color: var(--text); padding: 0 2px; border-radius: 2px; }
</style>

<div class="app">
  <header class="site-header">
    <h1>英文學習中心</h1>
    <div class="subtitle">我的英語學習資源，按時段快速找到能做的事</div>
  </header>

  <nav class="main-nav" id="mainNav">
    <button data-view="time" class="active">時段</button>
    <button data-view="shows">節目</button>
    <button data-view="course">聽力術課程</button>
    <button data-view="methods">方法</button>
    <button data-view="tools">工具</button>
  </nav>

  <main>
    <!-- ═══ Time View ═══ -->
    <section class="view" id="view-time">
      <div class="time-strip" id="timeStrip"></div>
      <div id="slotContent"></div>
    </section>

    <!-- ═══ Shows View ═══ -->
    <section class="view" id="view-shows" hidden>
      <div class="filter-bar" id="showFilters">
        <span class="chip active" data-lang="all">全部</span>
        <span class="chip" data-lang="en">English</span>
        <span class="chip" data-lang="zh">中文</span>
        <span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>
      </div>
      <div class="show-grid" id="showGrid"></div>
    </section>

    <!-- ═══ Course View ═══ -->
    <section class="view" id="view-course" hidden>
      <input class="search-box" id="courseSearch" placeholder="搜尋課程內容：輸入關鍵字 (e.g. 連音, schwa, idiom)">
      <div class="part-tabs" id="partTabs" style="margin-top:12px">
        <span class="chip active" data-p="0">全部 50 單元</span>
        <span class="chip" data-p="1">Part 1 精聽</span>
        <span class="chip" data-p="2">Part 2 泛聽</span>
        <span class="chip" data-p="3">Part 3 口音</span>
      </div>
      <div class="course-list" id="courseList"></div>
    </section>

    <!-- ═══ Methods View ═══ -->
    <section class="view" id="view-methods" hidden>
      <div class="method-grid" id="methodGrid"></div>
    </section>

    <!-- ═══ Tools View ═══ -->
    <section class="view" id="view-tools" hidden>
      <div class="tool-grid" id="toolGrid"></div>
    </section>
  </main>
</div>

const courseUnits = [{"id":1,"p":1,"t":"了解你的英文聽力問題 — 課程總覽","c":"課程總覽：英文聽力四大問題（語速快/連音、聽不出已學的字、抓不到重點、不熟悉口音），三大部分設計（Bottom-up精聽 → Top-down泛聽 → 世界口音），以及Listening Journal聽力日誌框架。","v":["syllable-timed language 音節計時語言","stress-timed language 重音計時語言","Bottom-up 由下至上","Top-down 由上至下","Intensive Listening 精聽"],"l":""},{"id":2,"p":1,"t":"聽不懂英文？其實是聽不出節奏 — 單字重音","c":"中文是音節計時語言(syllable-timed)，英文是重音計時語言(stress-timed)。重音音節：音調高、時間長、音量大；非重音音節則相反。判斷音節數可用拍手法。","v":["syllable 音節","stress 重音","stressed syllable 重音音節","unstressed syllable 非重音音節","schwa /ə/ 央元音"],"l":""},{"id":3,"p":1,"t":"語速快時，不見的字去哪裡了？ — 句子重音","c":"句子中的重音字（實詞/Content Words）包括名詞、動詞、形容詞、副詞；非重音字（虛詞/Function Words）包括助動詞、Be動詞、介系詞、代名詞、連接詞、冠詞。","v":["Content Words 實詞/內容字","Function Words 虛詞/功能字","stressed words 重音字","unstressed words 非重音字"],"l":""},{"id":4,"p":1,"t":"原來這些字有兩種念法 — 虛詞弱讀與 And, Or","c":"虛詞在句中為非重音，發音從重讀(strong form)變為弱讀(weak form)。央元音Schwa /ə/是最常見的弱讀母音。And /ænd/→/ən/，Or /ɔr/→/ər/。","v":["strong form 重讀","weak form 弱讀","schwa /ə/ 央元音","And /ænd/→/ən/","Or /ɔr/→/ər/"],"l":""},{"id":5,"p":1,"t":"原來這些字有兩種念法 — For, Of, To","c":"For /fɔr/→/fər/，Of /ɑv/→/əv/或/ə/，To /tu/→/tə/。Of後接子音常省略為/ə/，後接母音保留/əv/以便連音。","v":["For /fɔr/→/fər/","Of /ɑv/→/əv/或/ə/","To /tu/→/tə/"],"l":""},{"id":6,"p":1,"t":"搞懂總是聽不清楚的縮寫 — n't, 'd, 've","c":"n't的/t/常不送氣；'d可代表would/had/did三種；'ve發音/əv/或/ə/跟of弱讀很像。","v":["n't 縮寫（/t/不送氣）","'d = would/had/did","'ve = have /əv/或/ə/"],"l":""},{"id":7,"p":1,"t":"終於聽出 Can 以及 Can't 的差別","c":"Can弱讀/kən/，Can't讀/kænt/。三大判斷點：時間長短、母音差異、重音位置。最關鍵是「重音」。","v":["Can 弱讀 /kən/","Can't /kænt/","glottal stop 喉塞音"],"l":""},{"id":8,"p":1,"t":"找出英文聽力中不見的聲音 (1) — 喉塞音","c":"喉塞音(Glottal Stop)：字尾為塞音/p,t,k,b,d,g/且下一字首為子音時，尾音不釋放氣流。","v":["Glottal Stop 喉塞音/吞音","塞音 /p/ /t/ /k/ /b/ /d/ /g/"],"l":""},{"id":9,"p":1,"t":"找出英文聽力中不見的聲音 (2) — H-dropping, G-dropping","c":"H-dropping：非重音字的h開頭在句中常不發/h/。G-dropping：-ing結尾的/ɪŋ/弱化為/ɪn/。","v":["H-dropping 省略h","G-dropping 省略g","him→'im","going to→gonna"],"l":""},{"id":10,"p":1,"t":"破解聽力罩門：連音 (1) — 子音連母音","c" let currentView = 'time';
let selectedSlot = null;
let showLang = 'all';
let showCat = 'all';
let coursePart = 0;
let courseQuery = '';

// Detect current time slot
function detectSlot() {
  const h = new Date().getHours(), m = new Date().getMinutes();
  const mins = h * 60 + m;
  if (mins >= 420 && mins < 470) return 'breakfast';
  if (mins >= 470 && mins < 720) return 'morning';
  if (mins >= 720 && mins < 1050) return 'lunch';
  if (mins >= 1050 && mins < 1200) return 'evening';
  if (mins >= 1200 && mins < 1290) return 'dishes';
  if (mins >= 1290 || mins < 420) return 'quiet';
  return null;
}

// Platform link builder
function platformUrl(show, platform) {
  const q = encodeURIComponent(show.t);
  if (platform === 'a') return `https://podcasts.apple.com/search?term=${q}`;
  if (platform === 's') return `https://open.spotify.com/search/${q}`;
  if (platform === 'y') return `https://www.youtube.com/results?search_query=${q}`;
}

function renderPlatformLinks(show) {
  let html = '<span class="platform-links">';
  if (show.p.a) html += `<a href="${platformUrl(show,'a')}" target="_blank" rel="noopener" title="Apple Podcasts">AP</a>`;
  if (show.p.s) html += `<a href="${platformUrl(show,'s')}" target="_blank" rel="noopener" title="Spotify">SP</a>`;
  if (show.p.y) html += `<a href="${platformUrl(show,'y')}" target="_blank" rel="noopener" title="YouTube">YT</a>`;
  html += '</span>';
  return html;
}

function renderShowCard(s) {
  const tierClass = `badge-t${s.tier}`;
  const tierLabel = s.tier === 1 ? '① 優先' : s.tier === 2 ? '② 進階' : '③ 選聽';
  return `<div class="show-card" data-lang="${s.lang}">
    <div class="show-top">
      <span class="show-title">${s.t}</span>
      ${renderPlatformLinks(s)}
    </div>
    <div class="show-desc">${s.desc}</div>
    <div class="show-meta">
      <span class="badge ${tierClass}">${tierLabel}</span>
      <span class="badge badge-cat">${catLabels[s.cat]||s.cat}</span>
      ${s.freq ? '<span class="badge badge-freq">🎧 常聽</span>' : ''}
      ${s.note ? `<span class="show-note" style="font-size:.78rem;color:var(--text-3)">📌 ${s.note}</span>` : ''}
    </div>
  </div>`;
}

// ── Time View ──
function renderTimeStrip() {
  const now = detectSlot();
  const el = document.getElementById('timeStrip');
  el.innerHTML = timeSlots.map(s => {
    const isNow = s.id === now;
    const isActive = s.id === selectedSlot;
    return `<div class="time-card${isNow ? ' now' : ''}${isActive ? ' active' : ''}" data-slot="${s.id}">
      <span class="time-badge">${s.time}</span>
      <div class="time-icon">${s.icon}</div>
      <div class="time-label">${s.label}</div>
      <div class="time-dur">${s.dur}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('.time-card').forEach(card => {
    card.onclick = () => {
      const id = card.dataset.slot;
      selectedSlot = selectedSlot === id ? null : id;
      renderTimeStrip();
      renderSlotContent();
    };
  });
}

function renderSlotContent() {
  const el = document.getElementById('slotContent');
  if (!selectedSlot) {
    // Show overview of all slots
    el.innerHTML = `<div class="empty-state" style="padding:24px 0">
      <p style="font-size:1.1rem;color:var(--text)">選一個時段，看看你現在能做什麼</p>
      <p style="margin-top:4px">點擊上方時段卡片</p>
    </div>`;
    return;
  }

  const slot = timeSlots.find(s => s.id === selectedSlot);
  const slotShows = shows.filter(s => s.slots.includes(selectedSlot));
  const slotTools = tools.filter(t => t.slots.includes(selectedSlot));
  const slotMethods = methods.filter(m => m.slots.includes(selectedSlot));

  let html = `<div class="slot-intro">
    <h3>${slot.icon} ${slot.label}　<span style="font-weight:400;color:var(--text-2)">${slot.time}・${slot.dur}</span></h3>
    <span class="method-tag">${slot.method} ${slot.methodEn}</span>
    <p>${slot.tip}</p>
  </div>`;

  if (slotShows.length) {
    const enShows = slotShows.filter(s => s.lang === 'en');
    const zhShows = slotShows.filter(s => s.lang === 'zh');
    if (enShows.length) {
      html += `<div class="section-heading">English 節目</div>`;
      html += `<div class="show-grid">${enShows.map(renderShowCard).join('')}</div>`;
    }
    if (zhShows.length) {
      html += `<div class="section-heading">中文節目</div>`;
      html += `<div class="show-grid">${zhShows.map(renderShowCard).join('')}</div>`;
    }
  }

  if (slotTools.length) {
    html += `<div class="section-heading">學習工具</div>`;
    html += `<div class="tool-grid">${slotTools.map(t => `<div class="tool-card">
      <h4>${t.name}</h4>
      <p>${t.tip}</p>
      <span class="tool-link"><a href="${t.link}" target="_blank" rel="noopener">開啟 ${t.name} →</a></span>
    </div>`).join('')}</div>`;
  }

  if (slotMethods.length) {
    html += `<div class="section-heading">適合的學習方法</div>`;
    html += `<div class="method-grid">${slotMethods.map(m => `<div class="method-card">
      <h4>${m.name}</h4>
      <div class="method-en">${m.en}</div>
      <p>${m.desc}</p>
    </div>`).join('')}</div>`;
  }

  // Course suggestion for quiet time
  if (selectedSlot === 'quiet') {
    html += `<div class="section-heading">課程複習建議</div>`;
    html += `<div class="slot-intro" style="margin-top:0">
      <p style="margin:0">安靜時段適合複習<b>英文聽力術</b>課程。建議從 Part 1 精聽規則開始複習（連音、弱讀、喉塞音），
      搭配精聽六步驟實際練習。切換到「聽力術課程」頁面瀏覽全部 50 個單元。</p>
    </div>`;
  }

  el.innerHTML = html;
}

  const sep = bar.querySelector('span[style]');
  // Remove existing cat chips
  bar.querySelectorAll('.chip[data-cat]').forEach(c => c.remove());
  cats.forEach(cat => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (showCat === cat ? ' active' : '');
    chip.dataset.cat = cat;
    chip.textContent = catLabels[cat] || cat;
    bar.appendChild(chip);
  });
}

function renderShows() {
  let filtered = shows;
  if (showLang !== 'all') filtered = filtered.filter(s => s.lang === showLang);
  if (showCat !== 'all') filtered = filtered.filter(s => s.cat === showCat);
  filtered.sort((a, b) => a.tier - b.tier);

  const el = document.getElementById('showGrid');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state">沒有符合的節目</div>';
    return;
  }
  el.innerHTML = filtered.map(renderShowCard).join('');
}

// ── Course View ──
function renderCourse() {
  let filtered = courseUnits;
  if (coursePart > 0) filtered = filtered.filter(u => u.p === coursePart);
  if (courseQuery) {
    const q = courseQuery.toLowerCase();
    filtered = filtered.filter(u =>
      u.t.toLowerCase().includes(q) ||
      u.c.toLowerCase().includes(q) ||
      u.v.some(v => v.toLowerCase().includes(q))
    );
  }

  const el = document.getElementById('courseList');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state">沒有符合的單元</div>';
    return;
  }

  el.innerHTML = filtered.map(u => {
    const partLabel = u.p === 1 ? 'Part 1' : u.p === 2 ? 'Part 2' : 'Part 3';
    return `<div class="course-card" data-part="${u.p}" onclick="this.classList.toggle('open')">
      <div class="cc-head">
        <span class="cc-num">${String(u.id).padStart(2,'0')}</span>
        <span class="cc-title">${highlightText(u.t, courseQuery)}</span>
        ${u.l ? `<span class="cc-level">${u.l}</span>` : ''}
      </div>
      <div class="cc-concept">${highlightText(u.c, courseQuery)}</div>
      <div class="cc-expand">
        <div class="cc-vocab">
          ${u.v.map(v => `<span>${highlightText(v, courseQuery)}</span>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

function highlightText(text, query) {
  if (!query) return text;
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}

// ── Methods View ──
function renderMethods() {
  document.getElementById('methodGrid').innerHTML = methods.map(m => `<div class="method-card">
    <h4>${m.name}</h4>
    <div class="method-en">${m.en}</div>
    <p>${m.desc}</p>
    <ol class="method-steps" style="font-size:.85rem;color:var(--text-2);padding-left:18px;margin:8px 0 0">
      ${m.steps.map(s => `<li style="margin:2px 0">${s}</li>`).join('')}
    </ol>
    <div class="slot-tags">
      ${m.slots.map(sid => {
        const sl = timeSlots.find(s => s.id === sid);
        return `<span class="slot-tag">${sl.icon} ${sl.label}</span>`;
      }).join('')}
    </div>
  </div>`).join('');
}

// ── Tools View ──
function renderTools() {
  document.getElementById('toolGrid').innerHTML = tools.map(t => `<div class="tool-card">
    <h4>${t.name}</h4>
    <p>${t.desc}</p>
    <p style="margin-top:4px"><b>建議：</b>${t.tip}</p>
    <div class="slot-tags" style="margin-top:8px">
      ${t.slots.map(sid => {
        const sl = timeSlots.find(s => s.id === sid);
        return `<span class="slot-tag">${sl.icon} ${sl.label}</span>`;
      }).join('')}
    </div>
    <span class="tool-link"><a href="${t.link}" target="_blank" rel="noopener">開啟 ${t.name} →</a></span>
  </div>`).join('');
}

// ── Navigation ──
function switchView(view) {
  currentView = view;
  document.querySelectorAll('#mainNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  ['time','shows','course','methods','tools'].forEach(v => {
    const el = document.getElementById(`view-${v}`);
    if (el) el.hidden = v !== view;
  });
}

// ── Init ──
function init() {
  // Nav
  document.querySelectorAll('#mainNav button').forEach(btn => {
    btn.onclick = () => switchView(btn.dataset.view);
  });

  // Time view
  const nowSlot = detectSlot();
  if (nowSlot) selectedSlot = nowSlot;
  renderTimeStrip();
  renderSlotContent();

  // Shows view
  buildCatChips();
  renderShows();

  document.getElementById('showFilters').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    if (chip.dataset.lang !== undefined) {
      showLang = chip.dataset.lang;
      showCat = 'all';
    } else if (chip.dataset.cat !== undefined) {
      showCat = showCat === chip.dataset.cat ? 'all' : chip.dataset.cat;
    }
    document.querySelectorAll('#showFilters .chip').forEach(c => {
      if (c.dataset.lang !== undefined) c.classList.toggle('active', c.dataset.lang === showLang);
      else if (c.dataset.cat !== undefined) c.classList.toggle('active', c.dataset.cat === showCat);
    });
    renderShows();
  });

  // Course view
  renderCourse();
  document.getElementById('courseSearch').addEventListener('input', e => {
    courseQuery = e.target.value.trim();
    renderCourse();
  });
  document.getElementById('partTabs').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    coursePart = parseInt(chip.dataset.p);
    document.querySelectorAll('#partTabs .chip').forEach(c => {
      c.classList.toggle('active', parseInt(c.dataset.p) === coursePart);
    });
    renderCourse();
  });

  // Methods & Tools
  renderMethods();
  renderTools();
}

init();
</script>
