<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文學習中心</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  --ground: #f0f2f5;
  --surface: #ffffff;
  --surface-hover: #f6f8fa;
  --text: #1a1d21;
  --text-2: #5f6b7a;
  --text-3: #8b95a3;
  --border: #dfe3e8;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --active: #059669;
  --active-soft: #d1fae5;
  --p1: #dc2626; --p1-soft: #fee2e2;
  --p2: #2563eb; --p2-soft: #dbeafe;
  --p3: #d97706; --p3-soft: #fef3c7;
  --tier1: #059669; --tier2: #2563eb; --tier3: #94a3b8;
  --shadow: 0 1px 3px rgba(15,23,42,.06);
  --shadow-lg: 0 4px 14px rgba(15,23,42,.10);
  --radius: 14px;
  --radius-sm: 8px;
  --nav-bg: rgba(240,242,245,0.96);
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-body: 'Noto Sans TC', 'Source Sans 3', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f1318;
    --surface: #1a1f27;
    --surface-hover: #242a33;
    --text: #e2e6eb;
    --text-2: #8b95a3;
    --text-3: #5f6b7a;
    --border: #2d343e;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --active: #34d399;
    --active-soft: #064e3b;
    --p1: #f87171; --p1-soft: #450a0a;
    --p2: #60a5fa; --p2-soft: #172554;
    --p3: #fbbf24; --p3-soft: #451a03;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --shadow-lg: 0 4px 14px rgba(0,0,0,.4);
    --nav-bg: rgba(15,19,24,0.96);
  }
}
:root[data-theme="dark"] {
  --ground: #0f1318;
  --surface: #1a1f27;
  --surface-hover: #242a33;
  --text: #e2e6eb;
  --text-2: #8b95a3;
  --text-3: #5f6b7a;
  --border: #2d343e;
  --accent: #60a5fa;
  --accent-soft: #1e3a5f;
  --active: #34d399;
  --active-soft: #064e3b;
  --p1: #f87171; --p1-soft: #450a0a;
  --p2: #60a5fa; --p2-soft: #172554;
  --p3: #fbbf24; --p3-soft: #451a03;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 4px 14px rgba(0,0,0,.4);
  --nav-bg: rgba(15,19,24,0.96);
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  padding: 0;
  padding-bottom: 40px;
  margin: 0;
}
h1,h2,h3,h4 { font-family: var(--font-display); line-height: 1.25; margin: 0; text-wrap: balance; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: var(--font-body); cursor: pointer; border: none; background: none; color: var(--text); }
input { font-family: var(--font-body); }

/* ── Header ── */
.site-header {
  padding: 24px 16px 16px;
  border-bottom: 1px solid var(--border);
}
.site-header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.site-header .subtitle { color: var(--text-2); font-size: 14px; margin-top: 4px; }

/* ── Sticky Nav — pill buttons, horizontal scroll ── */
.main-nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--nav-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; gap: 8px;
  padding: 10px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-bottom: 1px solid var(--border);
}
.main-nav::-webkit-scrollbar { display: none; }
.main-nav button {
  flex: 0 0 auto;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 14px; font-weight: 500;
  white-space: nowrap;
  color: var(--text-2);
  transition: all .15s;
}
.main-nav button:hover { border-color: var(--accent); color: var(--text); }
.main-nav button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

/* ── Views ── */
.view { padding: 16px; }

/* ── Time Strip — 2 cols, large cards ── */
.time-strip {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.time-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 12px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  text-align: center;
}
.time-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.time-card.active { border-color: var(--accent); background: var(--accent-soft); }
.time-card.now { border-color: var(--active); }
.time-card.now .time-badge { background: var(--active); color: #fff; }
.time-badge {
  display: inline-block; font-size: 12px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  background: var(--border); color: var(--text-2);
  padding: 3px 8px; border-radius: 5px; letter-spacing: .03em;
}
.time-icon { font-size: 1.8rem; margin: 8px 0 4px; }
.time-label { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.time-dur { font-size: 13px; color: var(--text-2); margin-top: 2px; }

/* ── Slot Content ── */
.slot-intro {
  margin-top: 14px; padding: 16px; background: var(--surface);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.slot-intro h3 { font-size: 16px; }
.slot-intro .method-tag {
  display: inline-block; font-size: 13px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent);
  padding: 4px 10px; border-radius: 6px; margin-top: 6px;
}
.slot-intro p { font-size: 14px; color: var(--text-2); margin: 8px 0 0; line-height: 1.65; }

/* ── Section Heading ── */
.section-heading {
  font-size: 12px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-3); margin: 20px 0 10px;
}

/* ── Show Cards — full-width stacked ── */
.show-grid {
  display: flex; flex-direction: column; gap: 10px;
}
.show-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 8px;
  border-left: 3px solid var(--border);
  transition: box-shadow .15s;
}
.show-card:hover { box-shadow: var(--shadow-lg); }
.show-card[data-lang="en"] { border-left-color: var(--accent); }
.show-card[data-lang="zh"] { border-left-color: var(--p3); }
.show-card .show-top { display: flex; align-items: center; gap: 10px; }
.show-card .show-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; flex: 1; }
.show-card .show-desc { font-size: 14px; color: var(--text-2); line-height: 1.55; }
.show-card .show-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: auto; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; font-size: 12px; font-weight: 600;
  padding: 3px 10px; border-radius: 5px; white-space: nowrap;
}
.badge-t1 { background: #d1fae5; color: #065f46; }
.badge-t2 { background: #dbeafe; color: #1e40af; }
.badge-t3 { background: #f1f5f9; color: #64748b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .badge-t1 { background: #064e3b; color: #6ee7b7; }
  :root:not([data-theme="light"]) .badge-t2 { background: #172554; color: #93c5fd; }
  :root:not([data-theme="light"]) .badge-t3 { background: #334155; color: #94a3b8; }
}
:root[data-theme="dark"] .badge-t1 { background: #064e3b; color: #6ee7b7; }
:root[data-theme="dark"] .badge-t2 { background: #172554; color: #93c5fd; }
:root[data-theme="dark"] .badge-t3 { background: #334155; color: #94a3b8; }

.badge-cat { background: var(--surface-hover); color: var(--text-2); font-weight: 500; }
.badge-freq { background: #fef3c7; color: #92400e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .badge-freq { background: #451a03; color: #fbbf24; }
}
:root[data-theme="dark"] .badge-freq { background: #451a03; color: #fbbf24; }

/* ── Platform Links — big tap targets ── */
.platform-links { display: flex; gap: 6px; margin-left: auto; }
.platform-links a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 700;
  background: var(--surface-hover); color: var(--text-2);
  transition: background .15s;
}
.platform-links a:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; }

/* ── Filter Bar — horizontal scroll, pill chips ── */
.filter-bar {
  display: flex; gap: 8px; align-items: center;
  margin-bottom: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-bar .chip {
  flex: 0 0 auto;
  font-size: 14px; padding: 8px 16px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border);
  font-weight: 500; transition: all .15s; cursor: pointer;
  white-space: nowrap;
}
.filter-bar .chip:hover { border-color: var(--accent); }
.filter-bar .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.filter-bar .sep {
  width: 1px; height: 20px; background: var(--border); flex: 0 0 auto;
}

/* ── Search ── */
.search-box {
  width: 100%; padding: 12px 14px; font-size: 15px;
  background: var(--surface); border: 2px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  transition: border-color .15s; box-sizing: border-box;
}
.search-box:focus { outline: none; border-color: var(--accent); }
.search-box::placeholder { color: var(--text-3); }

/* ── Course Cards ── */
.course-list { display: flex; flex-direction: column; gap: 8px; }
.course-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
  cursor: pointer; transition: box-shadow .15s;
  border-left: 3px solid var(--border);
}
.course-card:hover { box-shadow: var(--shadow-lg); }
.course-card[data-part="1"] { border-left-color: var(--p1); }
.course-card[data-part="2"] { border-left-color: var(--p2); }
.course-card[data-part="3"] { border-left-color: var(--p3); }
.course-card .cc-head { display: flex; align-items: baseline; gap: 8px; }
.course-card .cc-num {
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  font-variant-numeric: tabular-nums;
  min-width: 28px;
}
.course-card[data-part="1"] .cc-num { color: var(--p1); }
.course-card[data-part="2"] .cc-num { color: var(--p2); }
.course-card[data-part="3"] .cc-num { color: var(--p3); }
.course-card .cc-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.course-card .cc-concept { font-size: 14px; color: var(--text-2); margin-top: 8px; line-height: 1.55; }
.course-card .cc-expand { overflow: hidden; max-height: 0; transition: max-height .3s ease; }
.course-card.open .cc-expand { max-height: 2400px; }
.course-card .cc-vocab {
  margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px;
}
.course-card .cc-vocab span {
  font-size: 12px; padding: 4px 10px; border-radius: 6px;
  background: var(--surface-hover); color: var(--text-2);
  border: 1px solid var(--border);
}
.course-card .cc-level {
  font-size: 12px; font-weight: 600; padding: 2px 8px;
  border-radius: 5px; background: var(--accent-soft); color: var(--accent);
  margin-left: auto; white-space: nowrap;
}
.part-tabs {
  display: flex; gap: 8px; margin-bottom: 14px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.part-tabs::-webkit-scrollbar { display: none; }
.part-tabs .chip {
  flex: 0 0 auto;
  font-size: 14px; padding: 8px 16px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border);
  font-weight: 500; cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.part-tabs .chip:hover { border-color: var(--accent); }
.part-tabs .chip.active { color: #fff; }
.part-tabs .chip[data-p="0"].active { background: var(--accent); border-color: var(--accent); }
.part-tabs .chip[data-p="1"].active { background: var(--p1); border-color: var(--p1); }
.part-tabs .chip[data-p="2"].active { background: var(--p2); border-color: var(--p2); }
.part-tabs .chip[data-p="3"].active { background: var(--p3); border-color: var(--p3); }

/* ── Method Cards — full-width stacked ── */
.method-grid {
  display: flex; flex-direction: column; gap: 12px;
}
.method-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.method-card h4 { font-size: 17px; }
.method-card .method-en { font-size: 14px; color: var(--text-2); font-style: italic; }
.method-card p { font-size: 14px; color: var(--text-2); margin: 8px 0 0; line-height: 1.6; }
.method-card .method-steps { font-size: 14px; color: var(--text-2); padding-left: 18px; margin: 10px 0 0; }
.method-card .method-steps li { margin: 4px 0; }
.method-card .slot-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.method-card .slot-tag {
  font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: var(--active-soft); color: var(--active); font-weight: 500;
}

/* ── Tool Cards — full-width stacked ── */
.tool-grid { display: flex; flex-direction: column; gap: 12px; }
.tool-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 6px;
}
.tool-card h4 { font-size: 17px; }
.tool-card p { font-size: 14px; color: var(--text-2); margin: 0; line-height: 1.6; }
.tool-card .tool-link { font-size: 14px; margin-top: auto; padding-top: 8px; }
.tool-card .slot-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tool-card .slot-tag {
  font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: var(--active-soft); color: var(--active); font-weight: 500;
}

/* ── Course Links (YouTube / Youglish / Platform) ── */
.cc-links {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
}
.cc-links a {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; padding: 6px 12px;
  border-radius: 999px; text-decoration: none;
  transition: opacity .15s;
}
.cc-links a:hover { opacity: .8; text-decoration: none; }
.cc-links .yt-link {
  background: #fee2e2; color: #dc2626;
}
.cc-links .course-link {
  background: var(--accent-soft); color: var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .cc-links .yt-link { background: #450a0a; color: #f87171; }
}
:root[data-theme="dark"] .cc-links .yt-link { background: #450a0a; color: #f87171; }

.cc-vocab a {
  color: inherit; text-decoration: none;
  border-bottom: 1px dashed var(--text-3);
  transition: border-color .15s, color .15s;
}
.cc-vocab a:hover {
  color: var(--accent); border-bottom-color: var(--accent);
  text-decoration: none;
}
.course-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
}
.course-header a {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 14px; font-weight: 600; padding: 8px 16px;
  border-radius: 999px; background: var(--accent); color: #fff;
  text-decoration: none; transition: opacity .15s;
}
.course-header a:hover { opacity: .85; text-decoration: none; }
.course-header .hint {
  font-size: 13px; color: var(--text-3);
}

/* ── Empty State ── */
.empty-state { text-align: center; padding: 40px 16px; color: var(--text-3); font-size: 15px; }

/* ── Notes（筆記／心得／標記）── */
.eh-notes {
  margin-top: 12px; padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-hover);
  border: 1px dashed var(--border);
  cursor: default;
}
.eh-notes .eh-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.eh-flag {
  font-size: 12px; padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font-weight: 500; line-height: 1.2;
  transition: all .12s;
}
.eh-flag:hover { border-color: var(--accent); }
.eh-flag.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.eh-flag.on[data-flag="hard"] { background: var(--p1); border-color: var(--p1); }
.eh-flag.on[data-flag="again"] { background: var(--p3); border-color: var(--p3); }
.eh-flag.on[data-flag="done"], .eh-flag.on[data-flag="fits"] { background: var(--active); border-color: var(--active); }
.eh-flag.on[data-flag="park"] { background: var(--text-3); border-color: var(--text-3); }
.eh-notes label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-top: 8px; }
.eh-notes textarea {
  display: block; width: 100%; box-sizing: border-box;
  margin-top: 4px; padding: 8px 10px; min-height: 58px;
  font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  resize: vertical;
}
.eh-notes textarea:focus { outline: none; border-color: var(--accent); }
.eh-notes textarea::placeholder { color: var(--text-3); }
.eh-save-state { font-size: 11px; color: var(--text-3); margin-top: 6px; text-align: right; min-height: 14px; }
.eh-badges { display: inline-flex; gap: 3px; margin-left: 6px; font-size: 12px; vertical-align: middle; }
.eh-badges:empty { display: none; }

/* show card notes toggle */
.show-card .eh-toggle {
  font-size: 13px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-2); background: var(--surface);
  white-space: nowrap; line-height: 1.2;
}
.show-card .eh-toggle:hover { border-color: var(--accent); color: var(--accent); }
.show-card .eh-toggle.has { border-color: var(--accent); color: var(--accent); }
.show-card .eh-notes { display: none; }
.show-card.notes-open .eh-notes { display: block; }

/* method / tool notes: collapsed by default */
.method-card .eh-notes, .tool-card .eh-notes { display: none; }
.method-card.notes-open .eh-notes, .tool-card.notes-open .eh-notes { display: block; }
.eh-toggle-inline {
  font-size: 12px; color: var(--text-3); margin-top: 8px; display: inline-block;
  border-bottom: 1px dashed var(--text-3);
}
.eh-toggle-inline.has { color: var(--accent); border-color: var(--accent); }

/* note filters on course view */
.note-filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
.note-filters .chip {
  font-size: 13px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border);
  font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap;
}
.note-filters .chip:hover { border-color: var(--accent); }
.note-filters .chip.active { background: var(--text); color: var(--ground); border-color: var(--text); }

/* ── 我的筆記 view ── */
.sync-status { font-size: 13px; color: var(--text-3); margin-bottom: 14px; }
.sync-status.ok { color: var(--active); }
.sync-status.err { color: var(--p1); }
.notes-block {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px;
}
.notes-block h3 { font-size: 16px; margin-bottom: 10px; }
.notes-block .hint { font-size: 13px; color: var(--text-3); }
.wish-add { display: flex; gap: 8px; margin-bottom: 10px; }
.wish-add input {
  flex: 1; min-width: 0; padding: 10px 12px; font-size: 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
}
.wish-add input:focus { outline: none; border-color: var(--accent); }
.wish-add button {
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
}
.wish-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.wish-item {

const courseUnits = [{"id":1,"p":1,"t":"了解你的英文聽力問題 — 課程總覽","c":"課程總覽：英文聽力四大問題（語速快/連音、聽不出已學的字、抓不到重點、不熟悉口音），三大部分設計（Bottom-up精聽 → Top-down泛聽 → 世界口音），以及Listening Journal聽力日誌框架。","v":["syllable-timed language 音節計時語言","stress-timed language 重音計時語言","Bottom-up 由下至上","Top-down 由上至下","Intensive Listening 精聽"],"l":""},{"id":2,"p":1,"t":"聽不懂英文？其實是聽不出節奏 — 單字重音","c":"中文是音節計時語言(syllable-timed)，英文是重音計時語言(stress-timed)。重音音節：音調高、時間長、音量大；非重音音節則相反。判斷音節數可用拍手法。","v":["syllable 音節","stress 重音","stressed syllable 重音音節","unstressed syllable 非重音音節","schwa /ə/ 央元音"],"l":""},{"id":3,"p":1,"t":"語速快時，不見的字去哪裡了？ — 句子重音","c":"句子中的重音字（實詞/Content Words）包括名詞、動詞、形容詞、副詞；非重音字（虛詞/Function Words）包括助動詞、Be動詞、介系詞、代名詞、連接詞、冠詞。","v":["Content Words 實詞/內容字","Function Words 虛詞/功能字","stressed words 重音字","unstressed words 非重音字"],"l":""},{"id":4,"p":1,"t":"原來這些字有兩種念法 — 虛詞弱讀與 And, Or","c":"虛詞在句中為非重音，發音從重讀(strong form)變為弱讀(weak form)。央元音Schwa /ə/是最常見的弱讀母音。And /ænd/→/ən/，Or /ɔr/→/ər/。","v":["strong form 重讀","weak form 弱讀","schwa /ə/ 央元音","And /ænd/→/ən/","Or /ɔr/→/ər/"],"l":""},{"id":5,"p":1,"t":"原來這些字有兩種念法 — For, Of, To","c":"For /fɔr/→/fər/，Of /ɑv/→/əv/或/ə/，To /tu/→/tə/。Of後接子音常省略為/ə/，後接母音保留/əv/以便連音。","v":["For /fɔr/→/fər/","Of /ɑv/→/əv/或/ə/","To /tu/→/tə/"],"l":""},{"id":6,"p":1,"t":"搞懂總是聽不清楚的縮寫 — n't, 'd, 've","c":"n't的/t/常不送氣；'d可代表would/had/did三種；'ve發音/əv/或/ə/跟of弱讀很像。","v":["n't 縮寫（/t/不送氣）","'d = would/had/did","'ve = have /əv/或/ə/"],"l":""},{"id":7,"p":1,"t":"終於聽出 Can 以及 Can't 的差別","c":"Can弱讀/kən/，Can't讀/kænt/。三大判斷點：時間長短、母音差異、重音位置。最關鍵是「重音」。","v":["Can 弱讀 /kən/","Can't /kænt/","glottal stop 喉塞音"],"l":""},{"id":8,"p":1,"t":"找出英文聽力中不見的聲音 (1) — 喉塞音","c":"喉塞音(Glottal Stop)：字尾為塞音/p,t,k,b,d,g/且下一字首為子音時，尾音不釋放氣流。","v":["Glottal Stop 喉塞音/吞音","塞音 /p/ /t/ /k/ /b/ /d/ /g/"],"l":""},{"id":9,"p":1,"t":"找出英文聽力中不見的聲音 (2) — H-dropping, G-dropping","c":"H-dropping：非重音字的h開頭在句中常不發/h/。G-dropping：-ing結尾的/ɪŋ/弱化為/ɪn/。","v":["H-dropping 省略h","G-dropping 省略g","him→'im","going to→gonna"],"l":""},{"id":10,"p":1,"t":"破解聽力罩門：連音 (1) — 子音連母音","c" /* ════════════════════════════════════════
   LOGIC
   ════════════════════════════════════════ */

let currentView = 'time';
let selectedSlot = null;
let showLang = 'all';
let showCat = 'all';
let coursePart = 0;
let courseQuery = '';
let noteFilter = '';

/* ════════════════════════════════════════
   NOTES STORE（筆記／心得／標記／清單）
   - 立即存 localStorage，600ms 後同步到 Firestore（englishHub collection）
   - 雲端有更新時（其他裝置寫的）以 updatedAt 較新者為準
   ════════════════════════════════════════ */
const EH_LS_KEY = 'eh_notes_v1';
const EH_FLAGS = {
  unit: [['done','✅ 上過'],['again','🔁 要再練'],['hard','🔥 很難']],
  show: [['fits','👍 適合我'],['again','🔁 想繼續聽'],['park','😵 太難先收']],
  method: [], tool: []
};
const EH_FLAG_ICON = { done:'✅', again:'🔁', hard:'🔥', fits:'👍', park:'😵' };
const EH_FIELDS = {
  unit: [['note','📝 筆記','規則、例子、自己聽錯的那句…'],['reflection','💭 心得','上完的感覺、卡在哪、下次想怎麼練…']],
  show: [['note','💭 感想','聽起來怎麼樣？哪一集好聽？聽不懂的是什麼…']],
  method: [['note','💭 心得','試過之後的感覺、自己的做法…']],
  tool: [['note','💭 心得','怎麼用最順、遇到的問題…']]
};

let ehStore = { items: {}, wishlist: [], wishlistUpdatedAt: '' };
let ehCloud = null;          // 由 module script 注入
let ehCloudOk = false;
const ehSaveTimers = {};

function ehLoadLocal() {
  try {
    const raw = localStorage.getItem(EH_LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        ehStore.items = parsed.items || {};
        ehStore.wishlist = Array.isArray(parsed.wishlist) ? parsed.wishlist : [];
        ehStore.wishlistUpdatedAt = parsed.wishlistUpdatedAt || '';
      }
    }
  } catch (e) { console.warn('localStorage 讀取失敗', e); }
}
function ehSaveLocal() {
  try { localStorage.setItem(EH_LS_KEY, JSON.stringify(ehStore)); }
  catch (e) { console.warn('localStorage 寫入失敗', e); }
}
function ehGet(id) { return ehStore.items[id] || null; }
function ehHasContent(it) {
  if (!it) return false;
  if ((it.note || '').trim() || (it.reflection || '').trim()) return true;
  return Object.values(it.flags || {}).some(Boolean);
}
function ehNowIso() { return new Date().toISOString(); }
function ehFmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const today = new Date();
  const same = d.toDateString() === today.toDateString();
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return same ? hm : `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}
function ehEsc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/** 更新一筆（patch 會合併），立即存本機、排程同步雲端 */
function ehUpdate(id, kind, patch) {
  const cur = ehStore.items[id] || { kind, flags: {} };
  const next = { ...cur, ...patch, kind, flags: { ...(cur.flags || {}), ...(patch.flags || {}) }, updatedAt: ehNowIso() };
  ehStore.items[id] = next;
  ehSaveLocal();
  ehSetSaveState(id, '儲存中…');
  clearTimeout(ehSaveTimers[id]);
  ehSaveTimers[id] = setTimeout(() => ehPushCloud(id), 600);
  ehHydrateBadges(id);
  if (currentView === 'notes') renderNotesView();
}
async function ehPushCloud(id) {
  const it = ehStore.items[id];
  if (!it) return;
  if (!ehCloud) { ehSetSaveState(id, `📱 已存本機 ${ehFmtTime(it.updatedAt)}`); return; }
  try {
    await ehCloud.save(id, it);
    ehCloudOk = true;
    ehSetSaveState(id, `☁️ 已同步 ${ehFmtTime(it.updatedAt)}`);
    ehRenderSyncStatus();
  } catch (e) {
    console.warn('雲端寫入失敗', e);
    ehCloudOk = false;
    ehSetSaveState(id, `📱 已存本機（雲端失敗）${ehFmtTime(it.updatedAt)}`);
    ehRenderSyncStatus(e);
  }
}
function ehSetSaveState(id, text) {
  document.querySelectorAll(`.eh-save-state[data-eh-for="${id}"]`).forEach(el => el.textContent = text);
}

/* 清單（之後想看／想聽） */
function ehWishAdd(text) {
  const t = (text || '').trim();
  if (!t) return;
  ehStore.wishlist.unshift({ id: 'w' + Date.now().toString(36), text: t, done: false, createdAt: ehNowIso() });
  ehWishChanged();
}
function ehWishToggle(id) {
  const w = ehStore.wishlist.find(x => x.id === id); if (!w) return;
  w.done = !w.done; ehWishChanged();
}
function ehWishDelete(id) {
  ehStore.wishlist = ehStore.wishlist.filter(x => x.id !== id); ehWishChanged();
}
function ehWishChanged() {
  ehStore.wishlistUpdatedAt = ehNowIso();
  ehSaveLocal();
  renderWishList();
  clearTimeout(ehSaveTimers.__wish);
  ehSaveTimers.__wish = setTimeout(async () => {
    if (!ehCloud) return;
    try { await ehCloud.saveWishlist(ehStore.wishlist, ehStore.wishlistUpdatedAt); ehCloudOk = true; ehRenderSyncStatus(); }
    catch (e) { console.warn('清單雲端寫入失敗', e); ehCloudOk = false; ehRenderSyncStatus(e); }
  }, 600);
}

/* ── 面板 HTML ── */
function renderNotesPanel(kind, id) {
  const flags = EH_FLAGS[kind] || [];
  const fields = EH_FIELDS[kind] || [];
  return `<div class="eh-notes" data-eh-panel="${id}">
    ${flags.length ? `<div class="eh-flags">${flags.map(([f, label]) =>
      `<button type="button" class="eh-flag" data-eh-id="${id}" data-eh-kind="${kind}" data-flag="${f}">${label}</button>`).join('')}</div>` : ''}
    ${fields.map(([f, label, ph]) =>
      `<label>${label}<textarea data-eh-id="${id}" data-eh-kind="${kind}" data-field="${f}" placeholder="${ph}" rows="2"></textarea></label>`).join('')}
    <div class="eh-save-state" data-eh-for="${id}"></div>
  </div>`;
}
function ehBadgesHtml(id) {
  const it = ehGet(id); if (!it) return '';
  const icons = Object.entries(it.flags || {}).filter(([,v]) => v).map(([f]) => EH_FLAG_ICON[f] || '').join(' ');
  const hasText = ((it.note||'').trim() || (it.reflection||'').trim()) ? '📝' : '';
  return [icons, hasText].filter(Boolean).join(' ');
}
/** 把 store 的值填進畫面上所有對應欄位（正在打字的欄位不動） */
function ehHydrate(root) {
  root = root || document;
  root.querySelectorAll('textarea[data-eh-id]').forEach(ta => {
    if (document.activeElement === ta) return;
    const it = ehGet(ta.dataset.ehId);
    const v = it ? (it[ta.dataset.field] || '') : '';
    if (ta.value !== v) ta.value = v;
  });
  root.querySelectorAll('.eh-flag[data-eh-id]').forEach(btn => {
    const it = ehGet(btn.dataset.ehId);
    btn.classList.toggle('on', !!(it && it.flags && it.flags[btn.dataset.flag]));
  });
  root.querySelectorAll('.eh-save-state[data-eh-for]').forEach(el => {
    const it = ehGet(el.dataset.ehFor);
    if (it && it.updatedAt && !el.textContent) el.textContent = `${ehCloudOk ? '☁️' : '📱'} ${ehFmtTime(it.updatedAt)}`;
  });
  root.querySelectorAll('[data-eh-badges]').forEach(el => { el.innerHTML = ehBadgesHtml(el.dataset.ehBadges); });
  root.querySelectorAll('[data-eh-has]').forEach(el => { el.classList.toggle('has', ehHasContent(ehGet(el.dataset.ehHas))); });
}
function ehHydrateBadges(id) {
  document.querySelectorAll(`[data-eh-badges="${id}"]`).forEach(el => { el.innerHTML = ehBadgesHtml(id); });
  document.querySelectorAll(`[data-eh-has="${id}"]`).forEach(el => { el.classList.toggle('has', ehHasContent(ehGet(id))); });
}

/* ── 雲端：由 module script 呼叫 ── */
window.ehAttachCloud = function (cloud) {
  ehCloud = cloud;
  ehRenderSyncStatus();
  cloud.subscribe((docs) => {
    // docs: { id: data }，含 __wishlist__
    let changed = false;
    Object.entries(docs).forEach(([id, data]) => {
      if (id === '__wishlist__') {
        const remoteAt = data.updatedAt || '';
        if (remoteAt > (ehStore.wishlistUpdatedAt || '')) {
          ehStore.wishlist = Array.isArray(data.items) ? data.items : [];
          ehStore.wishlistUpdatedAt = remoteAt; changed = true;
        } else if ((ehStore.wishlistUpdatedAt || '') > remoteAt) {
          cloud.saveWishlist(ehStore.wishlist, ehStore.wishlistUpdatedAt).catch(()=>{});
        }
        return;
      }
      const local = ehStore.items[id];
      const remoteAt = data.updatedAt || '';
      if (!local || remoteAt > (local.updatedAt || '')) { ehStore.items[id] = data; changed = true; }
      else if ((local.updatedAt || '') > remoteAt) { cloud.save(id, local).catch(()=>{}); }
    });
    // 本機有、雲端沒有的（例如離線時寫的）：推上去
    Object.entries(ehStore.items).forEach(([id, it]) => { if (!docs[id]) cloud.save(id, it).catch(()=>{}); });
    if (ehStore.wishlist.length && !docs.__wishlist__) cloud.saveWishlist(ehStore.wishlist, ehStore.wishlistUpdatedAt).catch(()=>{});
    ehCloudOk = true;
    ehRenderSyncStatus();
    if (changed) { ehSaveLocal(); ehHydrate(); renderWishList(); if (currentView === 'notes') renderNotesView(); }
  }, (err) => { ehCloudOk = false; ehRenderSyncStatus(err); });
};
function ehRenderSyncStatus(err) {
  const el = document.getElementById('syncStatus'); if (!el) return;
  if (!ehCloud) { el.textContent = '📱 目前只存在這台裝置（雲端模組未載入）'; el.className = 'sync-status'; return; }
  if (err) { el.textContent = '⚠️ 雲端同步失敗，筆記仍會存在這台裝置：' + (err.code || err.message || err); el.className = 'sync-status err'; return; }
  el.textContent = ehCloudOk ? '☁️ 已連接 Firestore，跨裝置同步中' : '☁️ 連線中…'; el.className = 'sync-status ' + (ehCloudOk ? 'ok' : '');
}

/* ── 我的筆記 view ── */
function renderWishList() {
  const el = document.getElementById('wishList'); if (!el) return;
  if (!ehStore.wishlist.length) { el.innerHTML = '<li class="hint" style="list-style:none">還沒有項目。聽到想回頭看的、想再練的，寫在這裡就不會忘。</li>'; return; }
  el.innerHTML = ehStore.wishlist.map(w => `<li class="wish-item${w.done ? ' done' : ''}" data-wid="${w.id}">
    <input type="checkbox" ${w.done ? 'checked' : ''} aria-label="完成">
    <span class="wish-text">${ehEsc(w.text)}</span>
    <button type="button" class="wish-del" title="刪除">✕</button>
  </li>`).join('');
}
function ehUnitTitle(id) { const u = courseUnits.find(x => 'unit_' + String(x.id).padStart(2,'0') === id); return u ? `${String(u.id).padStart(2,'0')} ${u.t}` : id; }
function ehShowTitle(id) { const s = shows.find(x => 'show_' + x.id === id); return s ? s.t : id; }
function ehMethodTitle(id) { const m = methods.find(x => 'method_' + x.id === id); return m ? m.name : id; }
function ehToolTitle(id) { const t = tools.find(x => 'tool_' + x.name === id); return t ? t.name : id; }
function ehTitle(id, kind) {
  if (kind === 'unit') return ehUnitTitle(id);
  if (kind === 'show') return ehShowTitle(id);
  if (kind === 'method') return ehMethodTitle(id);
  if (kind === 'tool') return ehToolTitle(id);
  return id;
}
function renderNotesView() {
  renderWishList();
  const items = Object.entries(ehStore.items).map(([id, it]) => ({ id, ...it }));
  // 課程進度
  const units = items.filter(i => i.kind === 'unit');
  const doneIds = units.filter(u => u.flags && u.flags.done).map(u => parseInt(u.id.slice(5)));
  const p1 = doneIds.filter(n => n <= 13).length, p2 = doneIds.filter(n => n >= 14 && n <= 34).length, p3 = doneIds.filter(n => n >= 35).length;
  document.getElementById('courseProgress').innerHTML =
    `<span class="progress-pill">Part 1 精聽 <b>${p1}/13</b></span>
     <span class="progress-pill">Part 2 泛聽 <b>${p2}/21</b></span>
     <span class="progress-pill">Part 3 口音 <b>${p3}/16</b></span>
     <span class="progress-pill">🔁 要再練 <b>${units.filter(u => u.flags && u.flags.again).length}</b></span>
     <span class="progress-pill">🔥 很難 <b>${units.filter(u => u.flags && u.flags.hard).length}</b></span>`;
  const flagged = units.filter(u => u.flags && (u.flags.again || u.flags.hard)).sort((a,b) => a.id.localeCompare(b.id));
  document.getElementById('flaggedUnits').innerHTML = flagged.length ? flagged.map(u =>
    `<div class="summary-item" data-jump="${u.id}" data-kind="unit">
      <span class="si-kind">${ehBadgesHtml(u.id)}</span>
      <span class="si-title">${ehEsc(ehUnitTitle(u.id))}</span>
      <span class="si-snip">${ehEsc((u.note || u.reflection || '').replace(/\s+/g,' '))}</span>
    </div>`).join('') : '<div class="hint">在課程單元裡按「🔁 要再練」或「🔥 很難」，會集中列在這裡。</div>';
  // 節目感想
  const sh = items.filter(i => i.kind === 'show' && ehHasContent(i)).sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||''));
  document.getElementById('showNotes').innerHTML = sh.length ? sh.map(s =>
    `<div class="summary-item" data-jump="${s.id}" data-kind="show">
      <span class="si-kind">${ehBadgesHtml(s.id)}</span>
      <span class="si-title">${ehEsc(ehShowTitle(s.id))}</span>
      <span class="si-snip">${ehEsc((s.note || '').replace(/\s+/g,' '))}</span>
      <span class="si-time">${ehFmtTime(s.updatedAt)}</span>
    </div>`).join('') : '<div class="hint">在節目卡片按「📝」寫感想，會集中列在這裡。</div>';
  // 最近寫的
  const recent = items.filter(i => ((i.note||'').trim() || (i.reflection||'').trim())).sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0, 12);
  const kindLabel = { unit:'課程', show:'節目', method:'方法', tool:'工具' };
  document.getElementById('recentNotes').innerHTML = recent.length ? recent.map(r =>
    `<div class="summary-item" data-jump="${r.id}" data-kind="${r.kind}">
      <span class="si-kind">${kindLabel[r.kind] || r.kind}</span>
      <span class="si-title">${ehEsc(ehTitle(r.id, r.kind))}</span>
      <span class="si-snip">${ehEsc(((r.note||'').trim() || (r.reflection||'')).replace(/\s+/g,' '))}</span>
      <span class="si-time">${ehFmtTime(r.updatedAt)}</span>
    </div>`).join('') : '<div class="hint">還沒有筆記。</div>';
}
/** 從「我的筆記」跳回原本的卡片並展開 */
function ehJump(id, kind) {
  if (kind === 'unit') {
    switchView('course'); coursePart = 0; courseQuery = ''; noteFilter = '';
    document.getElementById('courseSearch').value = '';
    document.querySelectorAll('#partTabs .chip').forEach(c => c.classList.toggle('active', c.dataset.p === '0'));
    document.querySelectorAll('#noteFilters .chip').forEach(c => c.classList.remove('active'));
    renderCourse();
    const card = document.querySelector(`.course-card[data-eh-card="${id}"]`);
    if (card) { card.classList.add('open'); card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  } else if (kind === 'show') {
    switchView('shows'); showLang = 'all'; showCat = 'all';
    document.querySelectorAll('#showFilters .chip').forEach(c => c.classList.toggle('active', c.dataset.lang === 'all'));
    renderShows();
    const card = document.querySelector(`#showGrid .show-card[data-eh-card="${id}"]`);
    if (card) { card.classList.add('notes-open'); card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  } else if (kind === 'method' || kind === 'tool') {
    switchView(kind === 'method' ? 'methods' : 'tools');
    const card = document.querySelector(`[data-eh-card="${id}"]`);
    if (card) { card.classList.add('notes-open'); card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
}

function detectSlot() {
  const h = new Date().getHours(), m = new Date().getMinutes();
  const mins = h * 60 + m;
  if (mins >= 420 && mins < 470) return 'breakfast';
  if (mins >= 470 && mins < 720) return 'morning';
  if (mins >= 720 && mins < 1050) return 'lunch';
  if (mins >= 1050 && mins < 1200) return 'evening';
  if (mins >= 1200 && mins < 1290) return 'dishes';
  if (mins >= 1290 || mins < 420) return 'quiet';
  return null;
}

function platformUrl(show, platform) {
  const q = encodeURIComponent(show.t);
  if (platform === 'a') return `https://podcasts.apple.com/search?term=${q}`;
  if (platform === 's') return `https://open.spotify.com/search/${q}`;
  if (platform === 'y') return `https://www.youtube.com/results?search_query=${q}`;
}

function renderPlatformLinks(show) {
  let html = '<span class="platform-links">';
  if (show.p.a) html += `<a href="${platformUrl(show,'a')}" target="_blank" rel="noopener" title="Apple Podcasts">AP</a>`;
  if (show.p.s) html += `<a href="${platformUrl(show,'s')}" target="_blank" rel="noopener" title="Spotify">SP</a>`;
  if (show.p.y) html += `<a href="${platformUrl(show,'y')}" target="_blank" rel="noopener" title="YouTube">YT</a>`;
  html += '</span>';
  return html;
}

function renderShowCard(s) {
  const tierClass = `badge-t${s.tier}`;
  const tierLabel = s.tier === 1 ? '① 優先' : s.tier === 2 ? '② 進階' : '③ 選聽';
  const nid = 'show_' + s.id;
  return `<div class="show-card" data-lang="${s.lang}" data-eh-card="${nid}">
    <div class="show-top">
      <span class="show-title">${s.t}<span class="eh-badges" data-eh-badges="${nid}"></span></span>
      ${renderPlatformLinks(s)}
      <button type="button" class="eh-toggle" data-eh-has="${nid}" data-eh-toggle="${nid}" title="寫感想">📝</button>
    </div>
    <div class="show-desc">${s.desc}</div>
    <div class="show-meta">
      <span class="badge ${tierClass}">${tierLabel}</span>
      <span class="badge badge-cat">${catLabels[s.cat]||s.cat}</span>
      ${s.freq ? '<span class="badge badge-freq">🎧 常聽</span>' : ''}
      ${s.note ? `<span style="font-size:12px;color:var(--text-3)">📌 ${s.note}</span>` : ''}
    </div>
    ${renderNotesPanel('show', nid)}
  </div>`;
}

// ── Time View ──
function renderTimeStrip() {
  const now = detectSlot();
  const el = document.getElementById('timeStrip');
  el.innerHTML = timeSlots.map(s => {
    const isNow = s.id === now;
    const isActive = s.id === selectedSlot;
    return `<div class="time-card${isNow ? ' now' : ''}${isActive ? ' active' : ''}" data-slot="${s.id}">
      <span class="time-badge">${s.time}</span>
      <div class="time-icon">${s.icon}</div>
      <div class="time-label">${s.label}</div>
      <div class="time-dur">${s.dur}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('.time-card').forEach(card => {
    card.onclick = () => {
      const id = card.dataset.slot;
      selectedSlot = selectedSlot === id ? null : id;
      renderTimeStrip();
      renderSlotContent();
    };
  });
}

function renderSlotContent() {
  const el = document.getElementById('slotContent');
  if (!selectedSlot) {
    el.innerHTML = `<div class="empty-state" style="padding:24px 0">
      <p style="font-size:16px;color:var(--text);margin:0">選一個時段，看看你現在能做什麼</p>
      <p style="margin:6px 0 0;font-size:14px">點擊上方時段卡片</p>
    </div>`;
    return;
  }

  const slot = timeSlots.find(s => s.id === selectedSlot);
  const slotShows = shows.filter(s => s.slots.includes(selectedSlot));
  const slotTools = tools.filter(t => t.slots.includes(selectedSlot));
  const slotMethods = methods.filter(m => m.slots.includes(selectedSlot));

  let html = `<div class="slot-intro">
    <h3>${slot.icon} ${slot.label}　<span style="font-weight:400;color:var(--text-2)">${slot.time}・${slot.dur}</span></h3>
    <span class="method-tag">${slot.method} ${slot.methodEn}</span>
    <p>${slot.tip}</p>
  </div>`;

  if (slotShows.length) {
    const enShows = slotShows.filter(s => s.lang === 'en');
    const zhShows = slotShows.filter(s => s.lang === 'zh');
    if (enShows.length) {
      html += `<div class="section-heading">English 節目</div>`;
      html += `<div class="show-grid">${enShows.map(renderShowCard).join('')}</div>`;
    }
    if (zhShows.length) {
      html += `<div class="section-heading">中文節目</div>`;
      html += `<div class="show-grid">${zhShows.map(renderShowCard).join('')}</div>`;
    }
  }

  if (slotTools.length) {
    html += `<div class="section-heading">學習工具</div>`;
    html += `<div class="tool-grid">${slotTools.map(t => `<div class="tool-card">
      <h4>${t.name}</h4>
      <p>${t.tip}</p>
      <span class="tool-link"><a href="${t.link}" target="_blank" rel="noopener">開啟 ${t.name} →</a></span>
    </div>`).join('')}</div>`;
  }

  if (slotMethods.length) {
    html += `<div class="section-heading">適合的學習方法</div>`;
    html += `<div class="method-grid">${slotMethods.map(m => `<div class="method-card">
      <h4>${m.name}</h4>
      <div class="method-en">${m.en}</div>
      <p>${m.desc}</p>
    </div>`).join('')}</div>`;
  }

  if (selectedSlot === 'quiet') {
    html += `<div class="section-heading">課程複習建議</div>`;
    html += `<div class="slot-intro" style="margin-top:0">
      <p style="margin:0;font-size:14px">安靜時段適合複習<b>英文聽力術</b>課程。建議從 Part 1 精聽規則開始複習（連音、弱讀、喉塞音），
      搭配精聽六步驟實際練習。切換到「聽力術課程」頁面瀏覽全部 50 個單元。</p>
    </div>`;
  }

  el.innerHTML = html;
  ehHydrate(el);
}

// ── Shows View ──
function buildCatChips() {
  const cats = [...new Set(shows.map(s => s.cat))];
  const bar = document.getElementById('showFilters');
  bar.querySelectorAll('.chip[data-cat]').forEach(c => c.remove());
  cats.forEach(cat => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (showCat === cat ? ' active' : '');
    chip.dataset.cat = cat;
    chip.textContent = catLabels[cat] || cat;
    bar.appendChild(chip);
  });
}

function renderShows() {
  let filtered = shows;
  if (showLang !== 'all') filtered = filtered.filter(s => s.lang === showLang);
  if (showCat !== 'all') filtered = filtered.filter(s => s.cat === showCat);
  filtered.sort((a, b) => a.tier - b.tier);

  const el = document.getElementById('showGrid');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state">沒有符合的節目</div>';
    return;
  }
  el.innerHTML = filtered.map(renderShowCard).join('');
  ehHydrate(el);
}

// ── Course View ──
function youglishUrl(term) {
  // Extract English part for Youglish search
  const en = term.replace(/[（(].+?[）)]/g, '').replace(/[^\x00-\x7F]+/g, '').trim();
  if (!en || en.length < 2) return null;
  return `https://youglish.com/pronounce/${encodeURIComponent(en)}/english`;
}

function renderVocab(v, query) {
  const url = youglishUrl(v);
  const text = highlightText(v, query);
  if (url) {
    return `<span><a href="${url}" target="_blank" rel="noopener" title="聽 Youglish 真人發音" onclick="event.stopPropagation()">${text}</a></span>`;
  }
  return `<span>${text}</span>`;
}

function renderMediaLinks(unitId) {
  const items = mediaMap[unitId];
  if (!items) return '';
  let html = '<div class="cc-links">';
  items.forEach(m => {
    if (m.direct) {
      html += `<a class="yt-link" href="${m.direct}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ ${m.t}</a>`;
    } else if (m.q) {
      html += `<a class="yt-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(m.q)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ ${m.t}</a>`;
    }
  });
  html += `<a class="course-link" href="${SLIDES_URL}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🎬 投影片</a>`;
  html += '</div>';
  return html;
}

function renderCourse() {
  let filtered = courseUnits;
  if (coursePart > 0) filtered = filtered.filter(u => u.p === coursePart);
  if (courseQuery) {
    const q = courseQuery.toLowerCase();
    filtered = filtered.filter(u =>
      u.t.toLowerCase().includes(q) ||
      u.c.toLowerCase().includes(q) ||
      u.v.some(v => v.toLowerCase().includes(q))
    );
  }

  if (noteFilter) {
    filtered = filtered.filter(u => {
      const it = ehGet('unit_' + String(u.id).padStart(2,'0'));
      if (!it) return false;
      if (noteFilter === 'noted') return !!((it.note||'').trim() || (it.reflection||'').trim());
      return !!(it.flags && it.flags[noteFilter]);
    });
  }

  const el = document.getElementById('courseList');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state">${noteFilter ? '還沒有標記成這一類的單元' : '沒有符合的單元'}</div>`;
    return;
  }

  el.innerHTML = filtered.map(u => {
    const hasMedia = mediaMap[u.id];
    const nid = 'unit_' + String(u.id).padStart(2,'0');
    return `<div class="course-card" data-part="${u.p}" data-eh-card="${nid}" onclick="if(!event.target.closest('.eh-notes')) this.classList.toggle('open')">
      <div class="cc-head">
        <span class="cc-num">${String(u.id).padStart(2,'0')}</span>
        <span class="cc-title">${highlightText(u.t, courseQuery)}${hasMedia ? ' 🎬' : ''}<span class="eh-badges" data-eh-badges="${nid}"></span></span>
        ${u.l ? `<span class="cc-level">${u.l}</span>` : ''}
      </div>
      <div class="cc-concept">${highlightText(u.c, courseQuery)}</div>
      <div class="cc-expand">
        <div class="cc-vocab">
          ${u.v.map(v => renderVocab(v, courseQuery)).join('')}
        </div>
        ${renderMediaLinks(u.id)}
        ${renderNotesPanel('unit', nid)}
      </div>
    </div>`;
  }).join('');
  ehHydrate(el);
}

function highlightText(text, query) {
  if (!query) return text;
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}

// ── Methods View ──
function renderMethods() {
  const el = document.getElementById('methodGrid');
  el.innerHTML = methods.map(m => { const nid = 'method_' + m.id; return `<div class="method-card" data-eh-card="${nid}">
    <h4>${m.name}<span class="eh-badges" data-eh-badges="${nid}"></span></h4>
    <div class="method-en">${m.en}</div>
    <p>${m.desc}</p>
    <ol class="method-steps">
      ${m.steps.map(s => `<li>${s}</li>`).join('')}
    </ol>
    <div class="slot-tags">
      ${m.slots.map(sid => {
        const sl = timeSlots.find(s => s.id === sid);
        return `<span class="slot-tag">${sl.icon} ${sl.label}</span>`;
      }).join('')}
    </div>
    <button type="button" class="eh-toggle-inline" data-eh-has="${nid}" data-eh-toggle="${nid}">📝 寫心得</button>
    ${renderNotesPanel('method', nid)}
  </div>`; }).join('');
  ehHydrate(el);
}

// ── Tools View ──
function renderTools() {
  const el = document.getElementById('toolGrid');
  el.innerHTML = tools.map(t => { const nid = 'tool_' + t.name; return `<div class="tool-card" data-eh-card="${nid}">
    <h4>${t.name}<span class="eh-badges" data-eh-badges="${nid}"></span></h4>
    <p>${t.desc}</p>
    <p style="margin-top:6px"><b>建議：</b>${t.tip}</p>
    <div class="slot-tags">
      ${t.slots.map(sid => {
        const sl = timeSlots.find(s => s.id === sid);
        return `<span class="slot-tag">${sl.icon} ${sl.label}</span>`;
      }).join('')}
    </div>
    <span class="tool-link"><a href="${t.link}" target="_blank" rel="noopener">開啟 ${t.name} →</a></span>
    <button type="button" class="eh-toggle-inline" data-eh-has="${nid}" data-eh-toggle="${nid}">📝 寫心得</button>
    ${renderNotesPanel('tool', nid)}
  </div>`; }).join('');
  ehHydrate(el);
}

// ── Navigation ──
function switchView(view) {
  currentView = view;
  document.querySelectorAll('#mainNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  ['time','shows','course','methods','tools','notes'].forEach(v => {
    const el = document.getElementById(`view-${v}`);
    if (el) el.hidden = v !== view;
  });
  if (view === 'notes') renderNotesView();
}

// ── Init ──
function init() {
  ehLoadLocal();

  document.querySelectorAll('#mainNav button').forEach(btn => {
    btn.onclick = () => switchView(btn.dataset.view);
  });

  // ── 筆記：事件委派（重新 render 也不用重綁）──
  document.addEventListener('input', e => {
    const ta = e.target.closest('textarea[data-eh-id]');
    if (!ta) return;
    ehUpdate(ta.dataset.ehId, ta.dataset.ehKind, { [ta.dataset.field]: ta.value });
  });
  document.addEventListener('click', e => {
    const flag = e.target.closest('.eh-flag[data-eh-id]');
    if (flag) {
      e.stopPropagation();
      const it = ehGet(flag.dataset.ehId);
      const on = !(it && it.flags && it.flags[flag.dataset.flag]);
      ehUpdate(flag.dataset.ehId, flag.dataset.ehKind, { flags: { [flag.dataset.flag]: on } });
      document.querySelectorAll(`.eh-flag[data-eh-id="${flag.dataset.ehId}"][data-flag="${flag.dataset.flag}"]`).forEach(b => b.classList.toggle('on', on));
      return;
    }
    const tog = e.target.closest('[data-eh-toggle]');
    if (tog) {
      e.stopPropagation();
      const card = tog.closest('[data-eh-card]');
      if (card) {
        card.classList.toggle('notes-open');
        if (card.classList.contains('notes-open')) { const ta = card.querySelector('textarea[data-eh-id]'); if (ta) ta.focus(); }
      }
      return;
    }
    const jump = e.target.closest('.summary-item[data-jump]');
    if (jump) { ehJump(jump.dataset.jump, jump.dataset.kind); return; }
    const wishItem = e.target.closest('.wish-item[data-wid]');
    if (wishItem) {
      if (e.target.closest('.wish-del')) ehWishDelete(wishItem.dataset.wid);
      else if (e.target.matches('input[type="checkbox"]')) ehWishToggle(wishItem.dataset.wid);
      return;
    }
  });
  // 課程頁的標記篩選
  document.getElementById('noteFilters').addEventListener('click', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    noteFilter = noteFilter === chip.dataset.nf ? '' : chip.dataset.nf;
    document.querySelectorAll('#noteFilters .chip').forEach(c => c.classList.toggle('active', c.dataset.nf === noteFilter));
    renderCourse();
  });
  // 清單
  const wishInput = document.getElementById('wishInput');
  document.getElementById('wishAdd').onclick = () => { ehWishAdd(wishInput.value); wishInput.value = ''; wishInput.focus(); };
  wishInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ehWishAdd(wishInput.value); wishInput.value = ''; } });
  renderWishList();

  const nowSlot = detectSlot();
  if (nowSlot) selectedSlot = nowSlot;
  renderTimeStrip();
  renderSlotContent();

  buildCatChips();
  renderShows();

  document.getElementById('showFilters').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    if (chip.dataset.lang !== undefined) {
      showLang = chip.dataset.lang;
      showCat = 'all';
    } else if (chip.dataset.cat !== undefined) {
      showCat = showCat === chip.dataset.cat ? 'all' : chip.dataset.cat;
    }
    document.querySelectorAll('#showFilters .chip').forEach(c => {
      if (c.dataset.lang !== undefined) c.classList.toggle('active', c.dataset.lang === showLang);
      else if (c.dataset.cat !== undefined) c.classList.toggle('active', c.dataset.cat === showCat);
    });
    renderShows();
  });

  renderCourse();
  document.getElementById('courseSearch').addEventListener('input', e => {
    courseQuery = e.target.value.trim();
    renderCourse();
  });
  document.getElementById('partTabs').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    coursePart = parseInt(chip.dataset.p);
    document.querySelectorAll('#partTabs .chip').forEach(c => {
      c.classList.toggle('active', parseInt(c.dataset.p) === coursePart);
    });
    renderCourse();
  });

  renderMethods();
  renderTools();
}

init();
</script>

<script type="module">
/* ═══ 雲端同步：沿用既有 ppl-plan Firebase 專案，使用獨立的 englishHub collection ═══
   - 這段載不進來（離線、被擋）時，上面的筆記功能照常運作，只是只存在本機。 */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD68ASVlyKiBOdvcyqIjil1DLNhibaxiaM",
  authDomain: "ppl-plan.firebaseapp.com",
  projectId: "ppl-plan",
  storageBucket: "ppl-plan.firebasestorage.app",
  messagingSenderId: "91585219195",
  appId: "1:91585219195:web:f1ce4e153622965f1930de"
};
const EH_COL = "englishHub"; // 與 places / pplEdits / pplLogs 完全獨立

try {
  const app = initializeApp(firebaseConfig, "englishHub");
  const db = getFirestore(app);
  const cloud = {
    save: (id, data) => setDoc(doc(db, EH_COL, id), data, { merge: true }),
    saveWishlist: (items, updatedAt) => setDoc(doc(db, EH_COL, "__wishlist__"), { items, updatedAt }, { merge: false }),
    subscribe: (onDocs, onErr) => onSnapshot(collection(db, EH_COL), snap => {
      const docs = {};
      snap.forEach(d => { docs[d.id] = d.data(); });
      onDocs(docs);
    }, onErr)
  };
  if (window.ehAttachCloud) window.ehAttachCloud(cloud);
} catch (e) {
  console.warn("Firebase 初始化失敗，改為只存本機", e);
}
</script>
